spring:
  jpa:
    open-in-view: false

  flyway:
    enabled: true
    validate-migration-naming: true

binance:
  api:
    key: ${BINANCE_API_KEY:}
    secret: ${BINANCE_API_SECRET:}

trading:
  symbols:
    - ETHUSDT
    - BTCUSDT

  safety:
    dedicated-account: ${TRADING_DEDICATED_ACCOUNT:false}

  execution:
    enabled: ${TRADING_EXECUTION_ENABLED:false}

  order:
    buy-quote-quantity: ${TRADING_BUY_QUOTE_QUANTITY:20.00}